[project]
name = "openevalz-eval-class-eval"
version = "0.1.0"
description = "OpenEvalz packaging of ClassEval: A Manually-Crafted Benchmark for Evaluating LLMs on Class-level Code Generation"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "class_eval"
execution_class = "sandbox-local"
cost_class = "high"
